<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Tastes Better With You</title>
    <style>
        body { margin: 0; background: #08050f; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Georgia', serif; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const W = canvas.width;
        const H = canvas.height;

        const COLORS = [
            '#ffa5cd', '#cda5ff', '#91d2ff', '#ffd7af', '#ffbee1'
        ];

        // Генерация контуров (имитация двух людей за столиком)
        // В реальном проекте вы бы использовали загруженную картинку и фильтр Canny
        const points = [];
        const numPoints = 3000;
        
        // Функция для создания силуэта (упрощенная версия)
        function generateSilhouette() {
            const cx = W / 2;
            const cy = H / 2 + 50;
            const scale = Math.min(W, H) / 800;

            // Левая фигура (парень)
            for (let i = 0; i < numPoints / 2; i++) {
                let angle = Math.random() * Math.PI * 2;
                let r = 100 * scale + Math.random() * 40;
                let x = cx - 150 * scale + Math.cos(angle) * r * 0.6;
                let y = cy - 50 * scale + Math.sin(angle) * r;
                
                // Ограничиваем область, чтобы было похоже на человека
                if (y > cy + 150 * scale) continue;
                points.push({ x: x, y: y });
            }

            // Правая фигура (девушка)
            for (let i = 0; i < numPoints / 2; i++) {
                let angle = Math.random() * Math.PI * 2;
                let r = 90 * scale + Math.random() * 40;
                let x = cx + 150 * scale + Math.cos(angle) * r * 0.6;
                let y = cy - 50 * scale + Math.sin(angle) * r;
                
                if (y > cy + 150 * scale) continue;
                points.push({ x: x, y: y });
            }
            
            // Столик (чашки)
            for (let i = 0; i < 500; i++) {
                let x = cx - 100 * scale + Math.random() * 200 * scale;
                let y = cy + 150 * scale + Math.random() * 50 * scale;
                points.push({ x: x, y: y });
            }

            // Сердечко над ними
            for (let i = 0; i < 200; i++) {
                let t = Math.random() * Math.PI * 2;
                let hx = 16 * Math.pow(Math.sin(t), 3);
                let hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                let hx_scaled = hx * 1.5;
                let hy_scaled = -hy * 1.5;
                points.push({ x: cx + hx_scaled, y: cy - 200 * scale + hy_scaled });
            }
        }

        generateSilhouette();

        let drawn = 0;
        const total = points.length;

        function getRandomColor() {
            return COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        function drawSparkle(x, y, color, size) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = size;
            ctx.moveTo(x - size * 2, y);
            ctx.lineTo(x + size * 2, y);
            ctx.moveTo(x, y - size * 2);
            ctx.lineTo(x, y + size * 2);
            ctx.stroke();
        }

        function animate() {
            ctx.fillStyle = '#08050f';
            ctx.fillRect(0, 0, W, H);

            // Текст
            ctx.font = "italic 30px Georgia";
            ctx.fillStyle = "#ffdcde";
            ctx.textAlign = "center";
            ctx.fillText("Coffee Tastes Better With You.", W / 2, 100);

            if (drawn < total) {
                for (let i = 0; i < 30; i++) {
                    if (drawn >= total) break;
                    const p = points[drawn];
                    const color = getRandomColor();
                    const size = Math.random() * 1.5 + 0.5;
                    drawSparkle(p.x, p.y, color, size);
                    drawn++;
                }
            } else {
                // Финальная пульсация
                for (let i = 0; i < 20; i++) {
                    const p = points[Math.floor(Math.random() * total)];
                    const color = getRandomColor();
                    const size = Math.random() * 2 + 1;
                    drawSparkle(p.x, p.y, color, size);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
